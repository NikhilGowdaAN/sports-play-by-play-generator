name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          pytest -v --tb=short || {
            python -c "import subprocess; res = subprocess.run(['pytest', '-q'], capture_output=True, text=True); print('::error::' + res.stdout.replace('\n', '%0A'))"
            exit 1
          }
